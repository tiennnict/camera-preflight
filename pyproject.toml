[project]
name = "camera-preflight"
version = "0.0.1"
description = "Windows desktop wizard that diagnoses a used camera before purchase"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10.0",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "rawpy>=0.21",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]

[project.scripts]
camera-preflight = "camera_preflight.cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-qt>=4.4",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "pyright>=1.1.370",
  "import-linter>=2.0",
  "babel>=2.14",
  "PySide6-Essentials>=6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_preflight"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs", "README.md", "AGENTS.md", "CLAUDE.md"]
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "RUF046", "E501"]

[tool.pyright]
include = ["src", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
strict = [
  "src/camera_preflight/domain",
  "src/camera_preflight/analysis",
]
reportMissingTypeStubs = false
reportPrivateImportUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gui: needs a Qt platform plugin (offscreen)"]

[tool.coverage.run]
source = ["src/camera_preflight"]

[tool.importlinter]
root_package = "camera_preflight"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["camera_preflight.domain"]
forbidden_modules = [
  "camera_preflight.analysis", "camera_preflight.checks", "camera_preflight.gate",
  "camera_preflight.io", "camera_preflight.knowledge", "camera_preflight.report",
  "camera_preflight.guide", "camera_preflight.synth", "camera_preflight.helpers",
  "camera_preflight.acquisition", "camera_preflight.backends", "camera_preflight.wizard",
  "camera_preflight.cli", "camera_preflight.gui",
]

[[tool.importlinter.contracts]]
name = "analysis depends on domain only"
type = "forbidden"
source_modules = ["camera_preflight.analysis"]
forbidden_modules = [
  "camera_preflight.checks", "camera_preflight.gate", "camera_preflight.io",
  "camera_preflight.knowledge", "camera_preflight.report", "camera_preflight.guide",
  "camera_preflight.synth", "camera_preflight.helpers", "camera_preflight.acquisition",
  "camera_preflight.backends", "camera_preflight.wizard", "camera_preflight.cli",
  "camera_preflight.gui",
]

[[tool.importlinter.contracts]]
name = "core layers do not import upper layers"
type = "forbidden"
source_modules = [
  "camera_preflight.gate", "camera_preflight.knowledge", "camera_preflight.io",
  "camera_preflight.checks",
]
forbidden_modules = [
  "camera_preflight.wizard", "camera_preflight.cli", "camera_preflight.gui",
  "camera_preflight.acquisition", "camera_preflight.helpers", "camera_preflight.backends",
  "camera_preflight.report",
]

[[tool.importlinter.contracts]]
name = "only gui imports PySide6"
type = "forbidden"
source_modules = [
  "camera_preflight.domain", "camera_preflight.analysis", "camera_preflight.checks",
  "camera_preflight.gate", "camera_preflight.io", "camera_preflight.knowledge",
  "camera_preflight.report", "camera_preflight.guide", "camera_preflight.synth",
  "camera_preflight.helpers", "camera_preflight.acquisition", "camera_preflight.backends",
  "camera_preflight.wizard", "camera_preflight.cli",
]
forbidden_modules = ["PySide6"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "wizard and cli do not import gui"
type = "forbidden"
source_modules = ["camera_preflight.wizard", "camera_preflight.cli"]
forbidden_modules = ["camera_preflight.gui"]

[[tool.importlinter.contracts]]
name = "backend implementations depend on domain only"
type = "forbidden"
source_modules = [
  "camera_preflight.backends.ptp", "camera_preflight.backends.wpd",
  "camera_preflight.backends.sdk",
]
forbidden_modules = [
  "camera_preflight.analysis", "camera_preflight.checks", "camera_preflight.gate",
  "camera_preflight.io", "camera_preflight.knowledge", "camera_preflight.report",
  "camera_preflight.wizard", "camera_preflight.acquisition", "camera_preflight.helpers",
  "camera_preflight.cli", "camera_preflight.gui",
]
